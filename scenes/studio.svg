<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 108" shape-rendering="crispEdges">
  <!--
    Studio apartment scene · 192×108 · Sweetie 16 palette
    每個可點物件是一個 <g data-object="id">，id 對應 studio.json。
    群組順序 = 繪製順序 = 鍵盤 Tab 順序，也要跟 studio.json 的 objects 順序一致。
    延長線的電線畫在背景裡：放進 power-strip 群組會把點擊範圍撐到曬衣架上。
  -->

  <!-- Background (not clickable) -->
