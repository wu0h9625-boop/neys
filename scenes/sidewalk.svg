<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 108" shape-rendering="crispEdges">
  <!--
    Sidewalk scene · 192×108 · Sweetie 16 palette
    每個可點物件是一個 <g data-object="id">，id 對應 sidewalk.json。
    群組順序 = 繪製順序 = 鍵盤 Tab 順序，也要跟 sidewalk.json 的 objects 順序一致。
    curb、bike-lane 很扁，畫面縮小時點擊範圍會往上下撐開。重疊的地方由後畫的物件接到點擊，
    所以順序是 bike-lane → curb → 人行道上的物件，三者看得到的部分都點得到。
  -->

